name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_VERSION: "10.0.x"
  CONFIGURATION: Release
  IMAGE_SERVER: ghcr.io/lukislp/obdgarage-server
  IMAGE_WEB: ghcr.io/lukislp/obdgarage-web

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # Test stage — runs on every push to main AND every pull request
  # ---------------------------------------------------------------------

  # OBD core unit tests: PID decoding (SAE J1979), the read-only command whitelist, and
  # Elm327Client behavior against a scripted ReplayTransport.
  test-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - run: dotnet test tests/ObdGarage.Tests/ObdGarage.Tests.csproj --configuration ${{ env.CONFIGURATION }} --collect:"XPlat Code Coverage"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xunit-coverage
          path: tests/ObdGarage.Tests/TestResults/**/coverage.cobertura.xml
          retention-days: 7

  # Full application/E2E/sync suite via the project's own dependency-free runner (built
  # for the offline session this project originated in - no NuGet needed to execute it,
  # just to compile it). Exercises the vehicle simulator, trip recording, maintenance
  # calculations, and full multi-device sync roundtrips against the real backend.
  test-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - run: dotnet build tools/ObdGarage.TestRunner/ObdGarage.TestRunner.csproj --configuration ${{ env.CONFIGURATION }}
      # TestRunner is a plain console app, not xUnit/VSTest - "dotnet test" coverage
      # collection doesn't apply. coverlet.console instead wraps the whole process:
      # instrumenting every assembly copied into its output folder (Core, Application,
      # Data, Obd, Server, Shared) while it runs, then reporting on what actually
      # executed. Exit code is non-zero whenever the wrapped run fails, so this still
      # gates the job on a real test failure, not just on coverage collection succeeding.
      # coverlet.console and reportgenerator are pinned local tools (.config/dotnet-tools.json).
      - run: dotnet tool restore
      - run: |
          dotnet tool run coverlet -- tools/ObdGarage.TestRunner/bin/${{ env.CONFIGURATION }}/net10.0/ObdGarage.TestRunner.dll \
            --target "dotnet" \
            --targetargs "tools/ObdGarage.TestRunner/bin/${{ env.CONFIGURATION }}/net10.0/ObdGarage.TestRunner.dll" \
            --format cobertura \
            --output testrunner-coverage.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testrunner-coverage
          path: testrunner-coverage.xml
          retention-days: 7

  # Merges the xUnit and TestRunner coverage into one self-hosted shields.io badge (no
  # external service/secret - same pattern as the other .NET repos in this portfolio).
  # Scoped to backend/business-logic assemblies: ObdGarage.Web (Blazor Server UI) is
  # excluded, no unit-test practice on Razor markup; ObdGarage.App (MAUI) isn't even part
  # of ObdGarage.slnx/CI. Test assemblies themselves are excluded so their own always-100%
  # coverage of their own test methods doesn't inflate the number.
  coverage:
    needs: [test-core, test-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: xunit-coverage
          path: xunit-coverage
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: testrunner-coverage
          path: testrunner-coverage
      - run: dotnet tool restore
      - run: >
          dotnet tool run reportgenerator
          -reports:"xunit-coverage/**/coverage.cobertura.xml;testrunner-coverage/testrunner-coverage.xml"
          -targetdir:coverage-summary
          -reporttypes:JsonSummary
          -assemblyfilters:"-ObdGarage.Web;-ObdGarage.Tests;-ObdGarage.TestRunner"
      - run: python3 scripts/generate_coverage_badge.py coverage-summary/Summary.json coverage-badge.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-badge
          path: coverage-badge.json
          retention-days: 7

  test-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - run: dotnet format ObdGarage.slnx --verify-no-changes --verbosity diagnostic

  build:
    # No implicit stage-sequencing under GitHub's DAG model (unlike GitLab) - wait for
    # every test job explicitly.
    needs: [test-core, test-e2e, test-lint]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - run: dotnet restore ObdGarage.slnx --locked-mode
      - run: dotnet build ObdGarage.slnx --configuration ${{ env.CONFIGURATION }} --no-restore

  # ---------------------------------------------------------------------
  # Version / docker / release — push to main only
  # ---------------------------------------------------------------------
  get-version:
    needs: [build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: obdgarage-release-chain
      cancel-in-progress: false
    # @semantic-release/github's verifyConditions step checks the token has repo push access
    # (contents: write) even during a dry run - a read-only token fails that check outright.
    # issues:write/pull-requests:write are NOT needed here: those only get exercised by the
    # publish/success/fail lifecycle steps, which dry_run: true skips entirely - confirmed
    # live on the studylife-ai sibling repo (2026-08-12).
    permissions:
      contents: write
    outputs:
      next_version: ${{ steps.semrel.outputs.new_release_version }}
      published: ${{ steps.semrel.outputs.new_release_published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Ruleset bypass for the release commit (2026-09-11 main-protection rollout): main is
      # protected by a ruleset (pull request + green test stage) that the GitHub Actions app
      # cannot be a bypass actor for on a personal repository, so semantic-release pushes over
      # SSH as a write-enabled DEPLOY KEY instead, which can. No-op while the secret is unset -
      # the push then goes through the GITHUB_TOKEN https remote exactly as before. Needed in
      # get-version too: @semantic-release/git's verifyConditions runs `git push --dry-run`
      # even in dry-run mode. Same mechanism as lukislp/studylife's ci-cd.yml.
      - name: Push as the semantic-release deploy key (if configured)
        uses: lukislp/ci-workflows/.github/actions/deploy-key-push@f3d5b5b26069f5678e813b2bc7440cb441aa28d0 # v1.1.0
        with:
          deploy-key: ${{ secrets.SEMANTIC_RELEASE_DEPLOY_KEY }}
      - id: semrel
        uses: lukislp/ci-workflows/.github/actions/semantic-release@c6305937598d262117eca032e1365d4880a3fe53 # v1.4.1
        with:
          dry-run: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: No release needed for this push
        if: steps.semrel.outputs.new_release_published != 'true'
        run: |
          echo "No releasable commits since the last tag (e.g. docs/ci/chore-only) - this is the expected, common case with Conventional Commits, not a failure. Downstream jobs below skip themselves via needs.get-version.outputs.published." | tee -a "$GITHUB_STEP_SUMMARY"

  # One native runner per platform instead of a single QEMU-emulated multi-platform build -
  # ubuntu-24.04-arm is a real arm64 GitHub-hosted runner (free for public repos), so that leg
  # runs at native speed (same pattern as lukislp/studylife). Each leg pushes by digest only;
  # docker-manifest-merge below writes the actual :latest/:<version> tags, and only after Trivy
  # passed on the amd64 image. Runs after semantic-release (not before): a build failure here
  # never leaves an orphaned, un-tagged GHCR image behind.
  docker-build-push:
    needs: [get-version, semantic-release]
    if: github.event_name == 'push' && needs.get-version.outputs.published == 'true'
    strategy:
      fail-fast: true
      matrix:
        image: [server, web]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - image: server
            registry_image: ghcr.io/lukislp/obdgarage-server
            dockerfile: docker/server.Dockerfile
            context: .
          - image: web
            registry_image: ghcr.io/lukislp/obdgarage-web
            dockerfile: docker/web.Dockerfile
            context: .
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      NEXT_VERSION: ${{ needs.get-version.outputs.next_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Smoke check on every leg (the runner is native for its platform, so the image can be
      # loaded and started locally) before anything is pushed.
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          tags: ${{ matrix.image }}:smoke-check
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
      - if: matrix.image == 'server'
        name: Smoke-check the built image
        run: |
          docker run -d --name smoke -p 5299:5299 -e InviteCode=smoke-test server:smoke-check
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5299/api/v1/health > /dev/null; then
              echo "container is healthy"
              docker rm -f smoke
              exit 0
            fi
            sleep 2
          done
          echo "::error::container did not become healthy in time"
          docker logs smoke
          docker rm -f smoke
          exit 1
      - if: matrix.image == 'web'
        name: Smoke-check the built image
        run: |
          docker run -d --name smoke -p 5199:5199  web:smoke-check
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5199/ > /dev/null; then
              echo "container is healthy"
              docker rm -f smoke
              exit 0
            fi
            sleep 2
          done
          echo "::error::container did not become healthy in time"
          docker logs smoke
          docker rm -f smoke
          exit 1
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ matrix.registry_image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}
          provenance: mode=max
          sbom: true
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Scans the amd64 image by digest before any tag exists: HIGH/CRITICAL are reported, a
  # CRITICAL with an available fix blocks the tag push (docker-manifest-merge needs this job).
  trivy-scan:
    needs: [get-version, docker-build-push]
    if: github.event_name == 'push' && needs.get-version.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        image: [server, web]
        include:
          - image: server
            registry_image: ghcr.io/lukislp/obdgarage-server
            dockerfile: docker/server.Dockerfile
            context: .
          - image: web
            registry_image: ghcr.io/lukislp/obdgarage-web
            dockerfile: docker/web.Dockerfile
            context: .
    concurrency:
      group: obdgarage-release-chain-${{ matrix.image }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: digests-${{ matrix.image }}-amd64
          path: /tmp/digests
      - name: Resolve amd64 digest reference
        run: echo "IMAGE_REF=${{ matrix.registry_image }}@sha256:$(ls /tmp/digests | head -1)" >> "$GITHUB_ENV"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Report HIGH and CRITICAL (informational)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0"
      - name: Gate on CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  docker-manifest-merge:
    needs: [get-version, docker-build-push, trivy-scan]
    if: github.event_name == 'push' && needs.get-version.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        image: [server, web]
        include:
          - image: server
            registry_image: ghcr.io/lukislp/obdgarage-server
            dockerfile: docker/server.Dockerfile
            context: .
          - image: web
            registry_image: ghcr.io/lukislp/obdgarage-web
            dockerfile: docker/web.Dockerfile
            context: .
    concurrency:
      group: obdgarage-release-chain-${{ matrix.image }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      NEXT_VERSION: ${{ needs.get-version.outputs.next_version }}
      IMAGE: ${{ matrix.registry_image }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      # A version tag that already exists is re-pointed at this commit's content instead of
      # failing the run: a parallel run's version race can leave stale content under the tag.
      - name: Check for a stale version tag (self-healing, does not block)
        id: check
        run: |
          SHA_TAG="sha-${GITHUB_SHA::7}"
          echo "sha_tag=$SHA_TAG" >> "$GITHUB_OUTPUT"
          if docker manifest inspect "${{ env.IMAGE }}:${{ env.NEXT_VERSION }}" >/dev/null 2>&1; then
            if docker manifest inspect "${{ env.IMAGE }}:${SHA_TAG}" >/dev/null 2>&1; then
              echo "Tag ${{ env.NEXT_VERSION }} already reflects this exact commit ($SHA_TAG) - re-tagging below is a harmless no-op."
            else
              echo "::warning::registry tag ${{ env.NEXT_VERSION }} already exists but was NOT built from this commit (no matching $SHA_TAG) - overwriting it with the content for $GITHUB_SHA."
            fi
          fi
      - name: Create and push the multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "${{ env.IMAGE }}:${{ env.NEXT_VERSION }}" \
            -t "${{ env.IMAGE }}:latest" \
            -t "${{ env.IMAGE }}:${{ steps.check.outputs.sha_tag }}" \
            $(printf "${{ env.IMAGE }}@sha256:%s " *)
      - name: Inspect the pushed manifest
        run: docker buildx imagetools inspect "${{ env.IMAGE }}:${{ env.NEXT_VERSION }}"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the multi-arch manifest (Sigstore keyless) and verify
        env:
          IDENTITY_REGEXP: '^https://github\.com/lukislp/ObdGarage/\.github/workflows/ci-cd\.yml@refs/heads/main$'
        run: |
          DIGEST="$(docker buildx imagetools inspect "${{ env.IMAGE }}:${{ env.NEXT_VERSION }}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          cosign sign --yes "${{ env.IMAGE }}@${DIGEST}"
          cosign verify \
            --certificate-identity-regexp "$IDENTITY_REGEXP" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${{ env.IMAGE }}@${DIGEST}" --output text >/dev/null
          echo "signed and verified ${{ env.IMAGE }}@${DIGEST}" | tee -a "$GITHUB_STEP_SUMMARY"

  semantic-release:
    # get-version listed explicitly (not just transitively) so its outputs are reliably
    # accessible below - GitHub Actions' needs context only guarantees access to
    # directly-listed dependencies. Runs before docker-manifest-merge/web now (see those
    # jobs' comments) - the real tag/release must exist before anything is published under
    # that version, so a build/push failure can't leave an orphaned, un-tagged GHCR image
    # blocking every future release via the duplicate-tag guard.
    needs: [get-version, coverage]
    if: github.event_name == 'push' && needs.get-version.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: obdgarage-release-chain
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Ruleset bypass for the release commit (2026-09-11 main-protection rollout): main is
      # protected by a ruleset (pull request + green test stage) that the GitHub Actions app
      # cannot be a bypass actor for on a personal repository, so semantic-release pushes over
      # SSH as a write-enabled DEPLOY KEY instead, which can. No-op while the secret is unset -
      # the push then goes through the GITHUB_TOKEN https remote exactly as before. Needed in
      # get-version too: @semantic-release/git's verifyConditions runs `git push --dry-run`
      # even in dry-run mode. Same mechanism as lukislp/studylife's ci-cd.yml.
      - name: Push as the semantic-release deploy key (if configured)
        uses: lukislp/ci-workflows/.github/actions/deploy-key-push@f3d5b5b26069f5678e813b2bc7440cb441aa28d0 # v1.1.0
        with:
          deploy-key: ${{ secrets.SEMANTIC_RELEASE_DEPLOY_KEY }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-badge
          path: coverage-artifact
      - run: mkdir -p .github/badges && mv coverage-artifact/coverage-badge.json .github/badges/coverage.json
      - id: semrel
        uses: lukislp/ci-workflows/.github/actions/semantic-release@c6305937598d262117eca032e1365d4880a3fe53 # v1.4.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      # Retry once for the narrow window where an out-of-band push to main landed between
      # this job's checkout and its own push (the concurrency group above already serializes
      # overlapping runs of this workflow, so this only guards against a genuinely external push).
      - if: steps.semrel.outcome == 'failure'
        name: "Diagnose before retrying (expected: an out-of-band push landed since checkout)"
        run: |
          git fetch origin main
          BEFORE_SHA="$(git rev-parse HEAD)"
          AFTER_SHA="$(git rev-parse origin/main)"
          if [ "$BEFORE_SHA" != "$AFTER_SHA" ]; then
            echo "origin/main moved since checkout ($BEFORE_SHA -> $AFTER_SHA) - this matches the out-of-band-push race this retry is designed for."
          else
            echo "::warning::origin/main did NOT move since checkout - this failure is likely NOT the expected out-of-band-push race. Retrying anyway, but check the semantic-release log above for the real cause before assuming this is just a race."
          fi
          git checkout -B main origin/main
      - if: steps.semrel.outcome == 'failure'
        uses: lukislp/ci-workflows/.github/actions/semantic-release@c6305937598d262117eca032e1365d4880a3fe53 # v1.4.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
