name: CI

# Test-only for now: this project doesn't cut versioned releases yet (persistence is
# still JSON pending an EF Core/SQLite swap, and it hasn't been validated against a real
# OBD2 adapter/vehicle) - a release pipeline would just churn through that instability.
# Revisit once the storage layer lands and/or real-hardware testing has happened.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "10.0.x"
  CONFIGURATION: Release

permissions:
  contents: read

jobs:
  # OBD core unit tests: PID decoding (SAE J1979), the read-only command whitelist, and
  # Elm327Client behavior against a scripted ReplayTransport.
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - run: dotnet test tests/CarApp.Tests/CarApp.Tests.csproj --configuration ${{ env.CONFIGURATION }}

  # Full application/E2E/sync suite via the project's own dependency-free runner (built
  # for the offline session this project originated in - no NuGet needed to execute it,
  # just to compile it). Exercises the vehicle simulator, trip recording, maintenance
  # calculations, and full multi-device sync roundtrips against the real backend.
  test-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - run: dotnet run --project tools/CarApp.TestRunner --configuration ${{ env.CONFIGURATION }}

  build:
    needs: [test-core, test-e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - run: dotnet restore CarApp.slnx
      - run: dotnet build CarApp.slnx --configuration ${{ env.CONFIGURATION }} --no-restore
